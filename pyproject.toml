[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-game-vault-gui"
version = "0.5.0a4"
description = "PySide6 Qt Widgets GUI for backend-neutral Offline Game Vault compositions"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "Apache-2.0"}
authors = [{name = "offline-game-vault-gui contributors"}]
dependencies = [
  "PySide6>=6.8,<7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: System :: Archiving",
]

[project.scripts]
ogv-gui = "offline_game_vault_gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.pbano.OfflineGameVault.Gui.desktop"]
